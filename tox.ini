[tox]
envlist = py{310,311,312}-dj{42,50,51,52}, py313-dj{51,52}, py313-coverage

[testenv]
deps=
    dj42: Django>=4.2,<5.0
    dj50: Django>=5.0,<5.1
    dj51: Django>=5.1,<5.2
    dj52: Django>=5.2,<6.0
commands=
    make test
allowlist_externals=make
set_env =
    UV_PROJECT_ENVIRONMENT={envdir}
passenv=
    LANG
    DATABASE_USER
    DATABASE_PASSWORD

[py313-dj52:py313-coverage]
commands=
    make coverage
deps=
    {[py313-dj52]deps}
    coverage==7.10.7

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
